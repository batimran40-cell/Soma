name: SOMA studio quality checks
on:
  push:
    branches:
      - feature/soma-admin-studio-milestones
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/soma-studio-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Run admin logic and security tests
        run: node --test tests/admin-*.test.mjs
      - name: Build production frontend
        run: npm run build
