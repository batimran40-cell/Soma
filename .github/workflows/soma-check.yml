name: SOMA frontend checks
on:
  push:
    branches:
      - feature/soma-premium-experience
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'vite.config.*'
      - '.github/workflows/soma-check.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
