name: SOMA responsive browser smoke
on:
  push:
    branches:
      - feature/soma-admin-studio-milestones
  pull_request:
    paths:
      - 'src/**'
      - 'tests/browser-smoke.mjs'
      - 'package*.json'
      - '.github/workflows/soma-browser-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project
        run: npm ci
      - name: Install browser runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test responsive pages and dialogs
        run: node tests/browser-smoke.mjs
      - name: Save visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soma-ui-screenshots
          path: artifacts/soma-ui/
          if-no-files-found: ignore
          retention-days: 7
